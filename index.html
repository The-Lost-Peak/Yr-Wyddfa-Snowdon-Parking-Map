<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Parking Locations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #000;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    #map { position: absolute; inset: 0; }

    /* pop-up: matches the site's cards (white, soft shadow, red pill button) */
    .mapboxgl-popup-content {
      padding: 12px 14px 13px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 28px -6px rgba(0,0,0,.35);
      font-family: Figtree, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      min-width: 128px;
    }
    .mapboxgl-popup-tip { display: none; }
    .pp-k { display: block; margin-bottom: 3px; font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #ed2629; }
    .pp-t { display: block; margin-bottom: 10px; font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: #1d1d1f; white-space: nowrap; }
    .mapboxgl-popup-content a.pp-b {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      height: 30px; padding: 0 14px; border-radius: 999px;
      background: #ed2629; color: #fff; font-size: 12px; font-weight: 600; text-decoration: none;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -14px rgba(0,0,0,.18);
      outline: none; border: 0;
    }
    .mapboxgl-popup-content a.pp-b:hover { background: #d41f22; }
    .pp-b svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  /* lp-icons-v1: same line icons as the Ethels map */
.mapboxgl-ctrl button.mapboxgl-ctrl-zoom-in .mapboxgl-ctrl-icon{background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231c1c1e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E")!important;background-size:22px 22px!important;background-position:center!important;background-repeat:no-repeat!important;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))!important}
.mapboxgl-ctrl button.mapboxgl-ctrl-zoom-out .mapboxgl-ctrl-icon{background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231c1c1e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 12h14'/%3E%3C/svg%3E")!important;background-size:22px 22px!important;background-position:center!important;background-repeat:no-repeat!important;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))!important}
.mapboxgl-ctrl button.mapboxgl-ctrl-fullscreen .mapboxgl-ctrl-icon{background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231c1c1e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='4,9 4,4 9,4'/%3E%3Cpolyline points='20,9 20,4 15,4'/%3E%3Cpolyline points='4,15 4,20 9,20'/%3E%3Cpolyline points='20,15 20,20 15,20'/%3E%3C/svg%3E")!important;background-size:22px 22px!important;background-position:center!important;background-repeat:no-repeat!important;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))!important}
.mapboxgl-ctrl button.mapboxgl-ctrl-shrink .mapboxgl-ctrl-icon{background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231c1c1e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='9,4 9,9 4,9'/%3E%3Cpolyline points='15,4 15,9 20,9'/%3E%3Cpolyline points='9,20 9,15 4,15'/%3E%3Cpolyline points='15,20 15,15 20,15'/%3E%3C/svg%3E")!important;background-size:22px 22px!important;background-position:center!important;background-repeat:no-repeat!important;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))!important}
.mapboxgl-ctrl button.mapboxgl-ctrl-compass .mapboxgl-ctrl-icon{background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231c1c1e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3l5 16-5-3.5L7 19z'/%3E%3C/svg%3E")!important;background-size:22px 22px!important;background-position:center!important;background-repeat:no-repeat!important;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))!important}
@media (max-width:600px){.mapboxgl-ctrl-group button .mapboxgl-ctrl-icon{background-size:16px 16px!important}}
.mapboxgl-ctrl-group button:hover{background-color:rgba(255,255,255,.45)!important}
</style>
<style>
/* ===== Button styling matched to The Ethels map (styling only) ===== */
.mapboxgl-ctrl-group:not(:empty){background:transparent!important;box-shadow:none!important;border-radius:0!important;display:flex;flex-direction:column;gap:10px}
.mapboxgl-ctrl-group button,.mapboxgl-ctrl-group button:first-child,.mapboxgl-ctrl-group button:last-child,.mapboxgl-ctrl-group button:only-child{width:50px!important;height:50px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.6)!important;background-color:rgba(255,255,255,.55)!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 6px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.28)!important;-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);transition:.15s;-webkit-tap-highlight-color:transparent;display:flex!important;align-items:center;justify-content:center;padding:0}
@supports((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.mapboxgl-ctrl-group button,.mapboxgl-ctrl-group button:first-child,.mapboxgl-ctrl-group button:last-child,.mapboxgl-ctrl-group button:only-child{background-color:rgba(255,255,255,.28)!important}}
.mapboxgl-ctrl-bottom-right{gap:10px!important}
.mapboxgl-ctrl-group button+button{border-top:1px solid rgba(255,255,255,.6)!important}
@media(hover:hover){.mapboxgl-ctrl-group button:not(:disabled):hover{background-color:rgba(56,153,236,.35)!important}}
.mapboxgl-ctrl-group button:focus{outline:0;box-shadow:inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 6px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.28)!important}
.mapboxgl-ctrl-group button .mapboxgl-ctrl-icon{background-size:40px 40px;filter:brightness(0) opacity(.89)}
.mapboxgl-ctrl-group button svg{width:22px;height:22px}
.mapboxgl-ctrl-group button svg *{stroke:#1c1c1e}
@media (max-width:767px){
  .mapboxgl-ctrl-group button,.mapboxgl-ctrl-group button:first-child,.mapboxgl-ctrl-group button:last-child,.mapboxgl-ctrl-group button:only-child{width:38px!important;height:38px!important}
  .mapboxgl-ctrl-group:not(:empty){gap:10px}
  .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon{background-size:30px 30px}
  .mapboxgl-ctrl-group button svg{width:16px;height:16px}
}
</style>
</head>
<body>
  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = "pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

    const carParks = [
      { name: "Main Parking",  coords: [-4.118987606889656, 53.116855315868506] },
      { name: "Alternative 1", coords: [-4.11967953327302, 53.11569959848021] },
      { name: "Alternative 2", coords: [-4.120560428836248, 53.11769235248277] },
      { name: "Alternative 3", coords: [-4.1245835, 53.120581613493414] }
    ];

    const map = new mapboxgl.Map({
      container: "map",
      cooperativeGestures: matchMedia("(pointer:coarse)").matches,   // phones: one finger scrolls the page, two move the map
      style: "mapbox://styles/mapbox/satellite-streets-v12",
      center: carParks[0].coords,
      zoom: 15,
      attributionControl: false
    });
    map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-left");   // credits behind an (i), like the other maps

    map.addControl(new mapboxgl.FullscreenControl(), "top-right");
    map.addControl(new mapboxgl.NavigationControl(), "bottom-right");

    function popupHtml(name, coords) {
      const main = /^main/i.test(name);
      const label = main ? "Start &amp; Finish" : "Alternative parking";
      const title = main ? "Main Parking" : name.replace(/^Alternative\s*/i, "Parking ");
      return `<span class="pp-k">${label}</span><span class="pp-t">${title}</span>`
        + `<a class="pp-b" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${coords[1]},${coords[0]}">`
        + `<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Directions</a>`;
    }

    let openPopup = null;

    carParks.forEach((p) => {
      const popup = new mapboxgl.Popup({
        offset: 16,
        closeButton: false,
        closeOnClick: false
      }).setHTML(popupHtml(p.name, p.coords));

      const marker = new mapboxgl.Marker({
        color: "#EC2629",
        scale: 0.85
      })
        .setLngLat(p.coords)
        .addTo(map);

      marker.getElement().addEventListener("click", () => {
        if (openPopup) openPopup.remove();
        popup.setLngLat(p.coords).addTo(map);
        openPopup = popup;
        map.flyTo({ center: p.coords, zoom: 15, essential: true });
      });
    });

    map.on("load", () => {
      const first = carParks[0];
      const firstPopup = new mapboxgl.Popup({
        offset: 16,
        closeButton: false,
        closeOnClick: false
      }).setHTML(popupHtml(first.name, first.coords))
        .setLngLat(first.coords)
        .addTo(map);

      openPopup = firstPopup;
      map.flyTo({ center: first.coords, zoom: 15, essential: true });
    });
  </script>
</body>
</html>
